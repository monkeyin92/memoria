name: memoria

services:
  speaker-model:
    image: "memoria-speaker-model:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.speaker-model
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    env_file:
      - /etc/memoria-speaker-model.env
    environment:
      MEMORIA_SPEAKER_MODEL_PATH: /models/campplus_cn_common.onnx
      MEMORIA_SPEAKER_MODEL_VERSION: campplus-cn-common@v1.0.0+ckpt.3388cf5f+onnx.7a39d2e5e566+fbank.v1
      MEMORIA_SPEAKER_MODEL_SHA256_PATH: /models/campplus_cn_common.onnx.sha256
      MEMORIA_SPEAKER_MODEL_MAX_CONCURRENCY: "1"
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 1g
    cpus: 2.0

  control-api:
    image: "memoria-control-api:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.control-api
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
        UV_DEFAULT_INDEX: "${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}"
    env_file:
      - /etc/memoria-control-api.env
    environment:
      ENVIRONMENT: production
      MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
      MEMORIA_DB_PATH: /data/memoria.sqlite3
      MEMORIA_SPEAKER_EMBEDDING_URL: http://speaker-model:8001/v1/embeddings/speaker
      MEMORIA_SPEAKER_EMBEDDING_MODEL: campplus-cn-common@v1.0.0+ckpt.3388cf5f+onnx.7a39d2e5e566+fbank.v1
    command:
      - /app/.venv/bin/uvicorn
      - services.control_api.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
    ports:
      - "127.0.0.1:8791:8000"
    volumes:
      - type: bind
        source: /var/lib/memoria
        target: /data
    depends_on:
      speaker-model:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  agent:
    image: "memoria-agent:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
        UV_DEFAULT_INDEX: "${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}"
    env_file:
      - /etc/memoria-agent.env
    environment:
      ENVIRONMENT: production
      MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -m
        - services.agent.src.heartbeat
        - --check-health
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: /var/lib/memoria-agent
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
