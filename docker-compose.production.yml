name: memoria

services:
  speaker-model:
    image: "memoria-speaker-model:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.speaker-model
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    env_file:
      - /etc/memoria-speaker-model.env
    environment:
      MEMORIA_SPEAKER_MODEL_PATH: /models/campplus_cn_common.onnx
      MEMORIA_SPEAKER_MODEL_VERSION: campplus-cn-common@v1.0.0+ckpt.3388cf5f+onnx.7a39d2e5e566+fbank.v1
      MEMORIA_SPEAKER_MODEL_SHA256_PATH: /models/campplus_cn_common.onnx.sha256
      MEMORIA_SPEAKER_MODEL_MAX_CONCURRENCY: "1"
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 1g
    cpus: 2.0

  control-api:
    image: "memoria-control-api:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.control-api
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
        UV_DEFAULT_INDEX: "${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}"
    env_file:
      - /etc/memoria-control-api.env
    environment:
      ENVIRONMENT: production
      MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
      MEMORIA_DB_PATH: /data/memoria.sqlite3
      MEMORIA_SPEAKER_EMBEDDING_URL: http://speaker-model:8001/v1/embeddings/speaker
      MEMORIA_SPEAKER_EMBEDDING_MODEL: campplus-cn-common@v1.0.0+ckpt.3388cf5f+onnx.7a39d2e5e566+fbank.v1
      MEDIA_EDGE_CONTROL_URL: "http://media-edge:8080"
    command:
      - /app/.venv/bin/uvicorn
      - services.control_api.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
    ports:
      - "127.0.0.1:8791:8000"
    volumes:
      - type: bind
        source: /var/lib/memoria
        target: /data
    depends_on:
      speaker-model:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  miniprogram-gateway:
    image: "memoria-miniprogram-gateway:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.miniprogram-gateway
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
        UV_DEFAULT_INDEX: "${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}"
    env_file:
      - /etc/memoria-miniprogram-gateway.env
    environment:
      ENVIRONMENT: production
    command:
      - /app/.venv/bin/uvicorn
      - services.miniprogram_gateway.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --workers
      - "1"
      - --no-access-log
    ports:
      - "127.0.0.1:8792:8010"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/health/live', timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  device-media-gateway:
    image: "memoria-device-media-gateway:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.miniprogram-gateway
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
        MEMORIA_IMAGE_ROLE: "device-media-gateway"
        UV_DEFAULT_INDEX: "${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}"
    env_file:
      - /etc/memoria-device-media-gateway.env
    environment:
      ENVIRONMENT: production
    command:
      - /app/.venv/bin/uvicorn
      - services.device_media_gateway.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
      - --workers
      - "1"
      - --no-access-log
    ports:
      - "127.0.0.1:8793:8011"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8011/health/live', timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  agent:
    image: "memoria-agent:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
        UV_DEFAULT_INDEX: "${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}"
    env_file:
      - /etc/memoria-agent.env
    environment:
      ENVIRONMENT: production
      MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -m
        - services.agent.src.heartbeat
        - --check-health
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: /var/lib/memoria-agent
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m

  # Optional rollout sidecar. It is not part of the default LiveKit profile;
  # enable the media-runtime profile only after the aggregate metrics are
  # instrumented and MEDIA_SLO_REPORT_TOKEN is provisioned.
  media-slo-reporter:
    profiles:
      - media-runtime
    image: "memoria-agent:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    env_file:
      - /etc/memoria-agent.env
    entrypoint:
      - /app/.venv/bin/python
    environment:
      ENVIRONMENT: production
      MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      MEDIA_SLO_METRICS_URL: "http://voice-core-media-bridge:9090/"
    command:
      - /app/scripts/run_media_slo_reporter.py
    depends_on:
      control-api:
        condition: service_healthy
      agent:
        condition: service_healthy
      voice-core-media-bridge:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  # The media-runtime profile is intentionally opt-in. It wires the self-owned
  # Go edge to the self-owned Python media-v1 bridge and Pion terminator. It
  # still requires external media acceptance. The shared Agent session factory
  # keeps memory/persona/permission/tool policy on the established product path
  # instead of creating a second LLM entry point.
  voice-core-media-bridge:
    profiles:
      - media-runtime
    image: "memoria-agent:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    env_file:
      - /etc/memoria-agent.env
    entrypoint:
      - /app/.venv/bin/python
    environment:
      ENVIRONMENT: production
      MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      MEDIA_BRIDGE_GRPC_ENABLED: "true"
      MEDIA_BRIDGE_GRPC_ADDR: "0.0.0.0:7001"
      MEDIA_BRIDGE_MTLS: "true"
      MEDIA_BRIDGE_SESSION_FACTORY: "services.agent.src.media_agent_factory:build_production_media_session_factory"
    command:
      - /app/scripts/run_media_bridge.py
    expose:
      - "7001"
      - "9090"
    volumes:
      - type: bind
        source: /etc/memoria-media-runtime
        target: /etc/memoria-media-runtime
        read_only: true
      - type: bind
        source: /var/lib/memoria-agent
        target: /data
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import socket;
          s=socket.create_connection(('127.0.0.1',7001),3);
          s.close()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  media-edge:
    profiles:
      - media-runtime
    image: "memoria-media-edge:${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    build:
      context: .
      dockerfile: infra/Dockerfile.media-edge
      args:
        MEMORIA_RELEASE_COMMIT: "${MEMORIA_RELEASE_COMMIT:?MEMORIA_RELEASE_COMMIT is required}"
        MEMORIA_RELEASE_TAG: "${MEMORIA_RELEASE_TAG:?MEMORIA_RELEASE_TAG is required}"
    env_file:
      - /etc/memoria-media-edge.env
    environment:
      ENVIRONMENT: production
      MEDIA_EDGE_HTTP_ADDR: ":8080"
      MEDIA_EDGE_INTERNAL_HTTP_ADDR: ":8081"
      MEDIA_EDGE_HEALTHCHECK_URL: "http://127.0.0.1:8081/readyz"
      MEDIA_EDGE_VOICE_CORE_ADDR: "voice-core-media-bridge:7001"
      MEDIA_EDGE_VOICE_CORE_REQUIRED: "true"
    expose:
      - "8080"
      - "8081"
    volumes:
      - type: bind
        source: /etc/memoria-media-runtime
        target: /etc/memoria-media-runtime
        read_only: true
    depends_on:
      voice-core-media-bridge:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/memoria-media-edge
        - healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
