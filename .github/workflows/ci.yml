name: ci

# Runs for pull requests, and on demand for a branch (Actions > ci > Run workflow).
# It no longer runs on every push to main: the merged tree was just tested in the
# pull request, and a second 10-minute run per merge only added waiting.
on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.agent }}
      python: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.python }}
      media_edge: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.media_edge }}
      miniprogram: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.miniprogram }}
      firmware: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.firmware }}
      firmware_build: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.firmware_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            agent:
              - 'services/agent/**'
              - 'packages/contracts/generation-fence-vectors.json'
              - 'services/control_api/tests/test_production_compose.py'
              - 'infra/Dockerfile.agent-source-overlay'
              - 'scripts/deploy_agent_component.sh'
              - 'scripts/run_media_bridge.py'
              - 'scripts/verify_agent_release_artifact.py'
              - 'scripts/resolve_target_images.py'
            python:
              - '.github/workflows/ci.yml'
              - 'HANDOFF.md'
              - 'TODOLIST.md'
              - 'README.md'
              - 'docs/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker-compose*.yml'
              - 'packages/**'
              - 'services/**/*.py'
              - 'services/**/*.sql'
              - '!services/control_api/tests/test_production_compose.py'
              - 'testing/**'
              - 'conftest.py'
              - 'infra/postgres/**'
              - 'infra/memoria-data.production.yml'
              - 'scripts/**/*.py'
              - 'scripts/**/*.sh'
              - '!scripts/deploy_agent_component.sh'
              - 'scripts/deploy_control_component.sh'
              - 'infra/Dockerfile.agent*'
              - '!infra/Dockerfile.agent-source-overlay'
              - 'infra/Dockerfile.control-api'
              - 'infra/Dockerfile.control-api-source-overlay'
              - 'infra/Dockerfile.speaker-model'
            media_edge:
              - 'packages/proto/**'
              - 'packages/contracts/generation-fence-vectors.json'
              - 'packages/contracts/device-keyword-stop-v2.example.json'
              - 'services/media_edge/**'
              - 'scripts/generate_media_go_proto.sh'
              - 'infra/Dockerfile.media-edge'
            miniprogram:
              - 'apps/miniprogram/**'
            firmware:
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'firmware/esp32/**'
              - 'packages/contracts/device-media-v2.json'
              - 'packages/contracts/device-keyword-stop-v2.example.json'
            firmware_build:
              - '.github/workflows/ci.yml'
              - 'firmware/esp32/**'

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Require host C++ compiler
        run: c++ --version
      - name: Firmware host regression tests
        run: >-
          uv run --frozen --extra dev pytest --import-mode=importlib --no-cov
          firmware/esp32/tests

  # Host tests only read memoria_protocol.cc as text; this job proves the
  # locked upstream + overlay actually compiles with the locked ESP-IDF.
  firmware-build:
    needs: changes
    if: needs.changes.outputs.firmware_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v6.0.2
    env:
      MEMORIA_ESP_IDF_PATH: /opt/esp/idf
    steps:
      - uses: actions/checkout@v4
      - name: Tools for the overlay check
        run: apt-get update -qq && apt-get install -y -qq ripgrep
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # GitHub's container: skips the image entrypoint, so the IDF Python env
      # is not exported until export.sh is sourced.
      - name: Build firmware from the locked upstream and overlay
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          export MEMORIA_PYTHON_BIN="$(command -v python)"
          cd firmware/esp32
          ./scripts/build.sh --no-idf-install
      - name: Overlay and artifact checks
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          export MEMORIA_PYTHON_BIN="$(command -v python)"
          cd firmware/esp32
          ./scripts/check-overlay.sh

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Ruff
        run: >-
          uv run ruff check services/agent
          services/control_api/tests/test_production_compose.py
      - name: Module line budgets
        run: uv run python scripts/check_module_budget.py check
      - name: Mypy
        run: uv run mypy services/agent --strict
      - name: Agent unit and deployment contract tests
        run: >-
          uv run pytest --import-mode=importlib --no-cov
          services/agent/tests/unit
          services/control_api/tests/test_production_compose.py
      - name: Agent release gate script tests
        run: >-
          uv run pytest --import-mode=importlib --no-cov
          scripts/tests/test_verify_agent_release_artifact.py
          scripts/tests/test_resolve_target_images.py
      - name: Agent source-overlay script syntax
        run: bash -n scripts/deploy_agent_component.sh

  python-gates:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORIA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Module line budgets
        run: uv run python scripts/check_module_budget.py check
      - name: Mypy
        run: uv run mypy services --strict
      - name: Control release tool gates (offline)
        run: >-
          uv run pytest --import-mode=importlib --no-cov
          scripts/tests/test_control_release_contract.py
          scripts/tests/test_verify_control_release_artifact.py
          scripts/tests/test_resolve_target_images.py
      - name: Control release artifact smoke (offline)
        env:
          ENVIRONMENT: development
          OFFLINE_MOCK: "true"
        run: uv run python -m scripts.verify_control_release_artifact
      - name: Component release script syntax
        run: |
          bash -n scripts/deploy_agent_component.sh
          bash -n scripts/deploy_control_component.sh
      - name: Media proto generation is reproducible
        run: |
          uv run --extra dev python scripts/generate_media_proto.py
          git diff --exit-code -- services/agent/src/voice_core/generated
      - name: Multi-subject contracts are reproducible
        run: uv run python scripts/generate_multi_subject_contracts.py --check
      - name: Authoritative PostgreSQL init and repeat-upgrade contract
        run: scripts/tests/run_authoritative_postgres_gate.sh
      - name: Media proto lint
        working-directory: packages/proto
        run: buf lint
      - name: Media proto breaking changes
        if: github.event_name == 'pull_request'
        working-directory: packages/proto
        run: |
          mkdir -p /tmp/memoria-proto-base
          git -C "$(git rev-parse --show-toplevel)" archive "${{ github.event.pull_request.base.sha }}" packages/proto \
            | tar -x -C /tmp/memoria-proto-base --strip-components=2
          buf breaking --against /tmp/memoria-proto-base
      - name: Media bridge contract smoke
        run: uv run python scripts/media_runtime_smoke.py
      - name: Media replay, chaos and load contract
        run: uv run python scripts/media_runtime_replay.py
      - name: Wake matrix tool regression (self-contained, no device)
        run: uv run pytest --import-mode=importlib --no-cov scripts/tests/test_wake_word_matrix.py
      - name: Offline E2E
        run: uv run python scripts/run_e2e.py --profile offline
      - name: Provider smoke (skip without keys)
        run: uv run python scripts/provider_smoke_test.py
        env:
          OFFLINE_MOCK: "true"

  # The Pytest step alone took 16 minutes in one process. The suite's PostgreSQL
  # tests share roles in one cluster and cannot run in parallel against it, so
  # the files are split across runners, each with its own PostgreSQL service
  # (scripts/ci_test_shards.py). `python` below folds the coverage back together.
  python-shards:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORIA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Pytest (shard ${{ matrix.shard }} of 4)
        env:
          MEMORIA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.data
        run: |
          mapfile -t files < <(uv run python scripts/ci_test_shards.py --shards 4 --index ${{ matrix.shard }})
          echo "${#files[@]} test files"
          # Coverage is checked on the combined data; a shard alone is far below it.
          # Per-test durations feed scripts/ci_test_durations.json (see ci_test_shards.py).
          uv run pytest --import-mode=importlib --cov=services --cov-report= --cov-fail-under=0 \
            --durations=0 --durations-min=0 "${files[@]}" | tee durations-shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.data
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-shard-${{ matrix.shard }}
          path: durations-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 14

  # The required `python` check: it fails when any shard, the gates or the image
  # build failed (a skipped job would otherwise count as passing), then combines
  # the shards' coverage and applies the coverage gates.
  python:
    needs: [changes, control-api-image, python-gates, python-shards]
    if: ${{ always() && needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every python job passed
        run: |
          echo "control-api-image=${{ needs.control-api-image.result }}"
          echo "python-gates=${{ needs.python-gates.result }}"
          echo "python-shards=${{ needs.python-shards.result }}"
          [[ "${{ needs.control-api-image.result }}" == success ]]
          [[ "${{ needs.python-gates.result }}" == success ]]
          [[ "${{ needs.python-shards.result }}" == success ]]
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --all-extras
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Coverage gates
        run: |
          uv run coverage combine coverage-shard-*.data
          uv run coverage report --show-missing
          uv run coverage report --fail-under=85
          uv run coverage report --include='services/agent/src/orchestration/*' --fail-under=90
          uv run coverage report --include='services/agent/src/providers/*_protocol.py' --fail-under=90

  media-edge:
    needs: changes
    if: needs.changes.outputs.media_edge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media_edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: services/media_edge/go.sum
      - name: Install Opus build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
      - name: Media proto Go generation is reproducible
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          cd ../..
          scripts/generate_media_go_proto.sh
          git diff --exit-code -- services/media_edge/gen
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: services/media_edge
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  agent-image:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Agent image with its in-build release gate
        run: docker build -f infra/Dockerfile.agent -t memoria-agent:ci .
      - name: Re-run the release gate against the shipped candidate
        run: >-
          docker run --rm --network none
          --entrypoint /app/.venv/bin/python memoria-agent:ci
          -m scripts.verify_agent_release_artifact

  control-api-image:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: control-ci-${{ github.sha }}
      BASE_IMAGE: memoria-control-api:ci-base-${{ github.sha }}
      CANDIDATE_IMAGE: memoria-control-api:ci-overlay-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate commit-bound image metadata
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
      - name: Build the Control API dependency base
        run: >-
          docker build
          --file infra/Dockerfile.control-api
          --tag "$BASE_IMAGE"
          --build-arg "MEMORIA_RELEASE_COMMIT=$RELEASE_COMMIT"
          --build-arg "MEMORIA_RELEASE_TAG=$RELEASE_TAG"
          .
      - name: Prepare the source-overlay build context
        run: |
          set -Eeuo pipefail
          context="$RUNNER_TEMP/control-api-overlay-context"
          rm -rf "$context"
          mkdir -p "$context/memoria/scripts"
          cp -a services "$context/memoria/services"
          cp -a packages "$context/memoria/packages"
          cp scripts/mark_readiness.py "$context/memoria/scripts/mark_readiness.py"
          cp scripts/rebuild_memory_projections.py "$context/memoria/scripts/rebuild_memory_projections.py"
          cp scripts/migrate_control_sqlite_to_postgres.py "$context/memoria/scripts/migrate_control_sqlite_to_postgres.py"
          cp scripts/verify_control_release_artifact.py "$context/memoria/scripts/verify_control_release_artifact.py"
          printf 'overlay_context=%s\n' "$context"
      - name: Build the source overlay with no network
        run: >-
          DOCKER_BUILDKIT=0 docker build --network none
          --file infra/Dockerfile.control-api-source-overlay
          --tag "$CANDIDATE_IMAGE"
          --build-arg "BASE_IMAGE=$BASE_IMAGE"
          --build-arg "MEMORIA_RELEASE_COMMIT=$RELEASE_COMMIT"
          --build-arg "MEMORIA_RELEASE_TAG=$RELEASE_TAG"
          "$RUNNER_TEMP/control-api-overlay-context"
      - name: Re-run the in-image verifier with no network
        run: >-
          docker run --rm --network none
          -e ENVIRONMENT=development -e OFFLINE_MOCK=true
          -e "MEMORIA_RELEASE_COMMIT=$RELEASE_COMMIT"
          -e "MEMORIA_RELEASE_TAG=$RELEASE_TAG"
          -e MEMORIA_RELEASE_ROLE=control-api
          -e MEMORIA_RELEASE_KIND=control-api-source-overlay
          --entrypoint /app/.venv/bin/python "$CANDIDATE_IMAGE"
          -m scripts.verify_control_release_artifact
          --expected-commit "$RELEASE_COMMIT"
          --expected-tag "$RELEASE_TAG" --require-metadata

  media-edge-image:
    needs: changes
    if: needs.changes.outputs.media_edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build media edge image
        run: docker build -f infra/Dockerfile.media-edge -t memoria-media-edge:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: memoria-media-edge:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  miniprogram:
    needs: changes
    if: needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/miniprogram/package-lock.json
      - name: Install
        run: npm --prefix apps/miniprogram ci --ignore-scripts
      - name: Test
        run: npm --prefix apps/miniprogram test
      - name: Syntax
        run: find apps/miniprogram -type f -name '*.js' ! -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
