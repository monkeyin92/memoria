name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      python: ${{ steps.filter.outputs.python }}
      h5: ${{ steps.filter.outputs.h5 }}
      media_edge: ${{ steps.filter.outputs.media_edge }}
      miniprogram: ${{ steps.filter.outputs.miniprogram }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            agent:
              - 'services/agent/**'
              - 'services/control_api/tests/test_production_compose.py'
              - 'infra/Dockerfile.agent-source-overlay'
              - 'scripts/deploy_agent_component.sh'
            python:
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker-compose*.yml'
              - 'packages/**'
              - 'services/**/*.py'
              - '!services/control_api/tests/test_production_compose.py'
              - 'scripts/**/*.py'
              - 'scripts/**/*.sh'
              - '!scripts/deploy_agent_component.sh'
              - 'infra/Dockerfile.agent*'
              - '!infra/Dockerfile.agent-source-overlay'
              - 'infra/Dockerfile.control-api'
              - 'infra/Dockerfile.miniprogram-gateway'
              - 'infra/Dockerfile.speaker-model'
            h5:
              - 'apps/h5/**'
            media_edge:
              - 'packages/proto/**'
              - 'services/media_edge/**'
              - 'scripts/generate_media_go_proto.sh'
              - 'infra/Dockerfile.media-edge'
            miniprogram:
              - 'apps/miniprogram/**'

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Ruff
        run: >-
          uv run ruff check services/agent
          services/control_api/tests/test_production_compose.py
      - name: Module line budgets
        run: uv run python scripts/check_module_budget.py check
      - name: Mypy
        run: uv run mypy services/agent --strict
      - name: Agent unit and deployment contract tests
        run: >-
          uv run pytest --import-mode=importlib --no-cov
          services/agent/tests/unit
          services/control_api/tests/test_production_compose.py
      - name: Agent source-overlay script syntax
        run: bash -n scripts/deploy_agent_component.sh

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORIA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: bufbuild/buf-setup-action@v1
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Module line budgets
        run: uv run python scripts/check_module_budget.py check
      - name: Mypy
        run: uv run mypy services --strict
      - name: Media proto generation is reproducible
        run: |
          uv run --extra dev python scripts/generate_media_proto.py
          git diff --exit-code -- services/agent/src/voice_core/generated
      - name: Multi-subject contracts are reproducible
        run: uv run python scripts/generate_multi_subject_contracts.py --check
      - name: Authoritative PostgreSQL init and repeat-upgrade contract
        run: scripts/tests/run_authoritative_postgres_gate.sh
      - name: Media proto lint
        working-directory: packages/proto
        run: buf lint
      - name: Media proto breaking changes
        if: github.event_name == 'pull_request'
        working-directory: packages/proto
        run: |
          mkdir -p /tmp/memoria-proto-base
          git -C "$(git rev-parse --show-toplevel)" archive "${{ github.event.pull_request.base.sha }}" packages/proto \
            | tar -x -C /tmp/memoria-proto-base --strip-components=2
          buf breaking --against /tmp/memoria-proto-base
      - name: Media bridge contract smoke
        run: uv run python scripts/media_runtime_smoke.py
      - name: Media replay, chaos and load contract
        run: uv run python scripts/media_runtime_replay.py
      - name: Pytest
        run: uv run pytest --import-mode=importlib --cov=services --cov-report=term-missing
        env:
          MEMORIA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Coverage gates
        run: |
          uv run coverage report --fail-under=85
          uv run coverage report --include='services/agent/src/orchestration/*' --fail-under=90
          uv run coverage report --include='services/agent/src/providers/*_protocol.py' --fail-under=90
      - name: Offline E2E
        run: uv run python scripts/run_e2e.py --profile offline
      - name: Provider smoke (skip without keys)
        run: uv run python scripts/provider_smoke_test.py
        env:
          OFFLINE_MOCK: "true"

  h5:
    needs: changes
    if: needs.changes.outputs.h5 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/h5/package-lock.json
      - name: Install
        working-directory: apps/h5
        run: npm ci
      - name: Test
        working-directory: apps/h5
        run: npm test
      - name: Build
        working-directory: apps/h5
        run: npm run build

  media-edge:
    needs: changes
    if: needs.changes.outputs.media_edge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media_edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: services/media_edge/go.sum
      - name: Install Opus build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
      - name: Media proto Go generation is reproducible
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          cd ../..
          scripts/generate_media_go_proto.sh
          git diff --exit-code -- services/media_edge/gen
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: services/media_edge
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  media-edge-image:
    needs: changes
    if: needs.changes.outputs.media_edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build media edge image
        run: docker build -f infra/Dockerfile.media-edge -t memoria-media-edge:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: memoria-media-edge:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  miniprogram:
    needs: changes
    if: needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/miniprogram/package-lock.json
      - name: Install
        run: npm --prefix apps/miniprogram ci --ignore-scripts
      - name: Test
        run: npm --prefix apps/miniprogram test
      - name: Syntax
        run: find apps/miniprogram -type f -name '*.js' ! -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
