if(step===1)body='<p class="flow-subtitle">2 / 5 · 连接网络</p><h2>让设备连上家里的 Wi-Fi</h2><p class="page-lede">以下为虚构网络。请勿输入真实密码。</p><label class="field" for="wifi-name">Wi-Fi 名称<select id="wifi-name"><option>Memoria-Demo-Home</option><option>Memoria-Demo-Study</option><option value="manual">手动输入网络名称</option></select></label><label class="field" id="wifi-manual-field" hidden>网络名称<input id="wifi-manual" maxlength="32" placeholder="只输入演示名称" autocomplete="off"></label><label class="field" for="wifi-password">演示密码<div class="wifi-password"><input id="wifi-password" type="password" autocomplete="off" maxlength="63" placeholder="任意 8 位以上演示字符"><button data-action="password" aria-label="显示演示密码">显示</button></div></label><p class="inline-error" id="wifi-error" role="alert"></p>'+notice('密码只在当前输入框中。离开页面或切到后台即清空，不上传、不保存。','LockKeyhole')+'<div class="flow-foot">'+button('演示连接 Wi-Fi','data-action="wifi-next"')+'</div>';
if(step===2)body='<p class="flow-subtitle">3 / 5 · 选择使用者</p><h2>这台设备给谁用？</h2><p class="page-lede">账号管理权与个人资料权限分开设置。</p><div class="flow-art">'+icon('UsersRound')+'</div>'+button('选择使用者','data-route="bind"')+notice('给孩子使用时先完成监护确认；全家共用时，每个人的内容仍分别管理。','ShieldCheck');
if(step===3)body='<p class="flow-subtitle">4 / 5 · 主人声纹</p><h2>让设备认识使用者的声音</h2><p class="page-lede">请成年使用者本人在设备上分四段说话，手机只显示进度。可以稍后再做。</p><div class="voice-steps">'+['自然','轻声','带笑','认真'].map((t,i)=>'<div class="voice-step '+(i<state.enroll?'done':'')+'"><span class="step-num">'+(i<state.enroll?icon('Check'):i+1)+'</span><span class="row-copy"><strong>'+t+'</strong><small>'+(i<state.enroll?'演示已完成':i===state.enroll?'下一段':'前一段完成后解锁')+'</small></span></div>').join('')+'</div>'+(state.enroll<4?'<label class="check-line"><input type="checkbox" id="enroll-consent"><span>我同意在设备上登记本人的声纹用于身份确认，可在隐私设置撤回。此原型不调用麦克风。</span></label>'+button('演示完成第 '+(state.enroll+1)+' 段','data-action="enroll-next" id="enroll-button" disabled'):notice('四段演示已完成。正式版本需等待设备回执确认，不能仅凭按钮视为成功。','Check'))+'<div class="flow-foot">'+button(state.enroll===4?'完成演示启用':'先跳过声纹，完成连接','data-action="onboard-complete"',state.enroll===4?'primary':'secondary')+'</div>';
if(step===3&&state.useFor==='child')body='<p class="flow-subtitle">4 / 5 · 确认使用范围</p><h2>无需录制孩子的声音</h2><p class="page-lede">儿童使用模式不登记主人声纹。监护关系不等于孩子的声音身份认证。</p>'+notice('监护关系已在本次演示中确认。内容仍按各自权限管理，不自动向家人共享。','ShieldCheck')+'<p class="caption" style="margin-top:18px">正式版本以服务端允许的儿童功能为准，不开放成人专属能力。</p><div class="flow-foot">'+button('确认范围，完成演示连接','data-action="onboard-complete"')+'</div>';
if(step===4)body='<div class="empty"><div class="checkmark">'+icon('Check')+'</div><h2>设备准备好了</h2><p>这是启用成功的演示页面。正式产品需要收到设备确认，才会显示完成。</p></div><div class="card"><h3>接下来怎么用？</h3><ul class="checklist"><li>'+icon('MessageCircleQuestion')+'在设备旁唤醒「茉莉」</li><li>'+icon('BookOpen')+'在「回顾」查看已同步的记录</li><li>'+icon('BookmarkCheck')+'确认哪些事值得长期记住</li></ul></div><div class="flow-foot">'+button('回到首页','data-action="finish-onboarding"')+'</div>';
return title('首次启用','',true)+progress+body+(step>0&&step<4?'<div class="flow-foot">'+button('稍后继续','data-action="pause-onboarding"','text-btn')+button('重新开始','data-action="restart-onboarding"','text-btn')+'</div>':'');}

function editMemory(id){const r=state.records.find(x=>x.id===id);if(!r)return;modal('这件事，要记住吗？','<p class="sheet-copy">你可以修改成更准确的说法，也可以不保存。</p><label class="field">记忆内容<textarea id="memory-edit" maxlength="160">'+esc(r.text)+'</textarea></label><p class="caption">'+esc(r.source)+'</p><p class="inline-error" id="memory-error" role="alert"></p><div class="flow-foot">'+button('确认并记住','data-action="save-memory" data-id="'+id+'"')+button('不保存这件事','data-action="dismiss-memory" data-id="'+id+'"','secondary')+'</div>');}
function decide(id,action,value){const r=state.records.find(x=>x.id===id);if(!r)return;if(action==='confirm'&&value!==undefined&&!value.trim()){document.getElementById('memory-error').textContent='请写下一句话，或选择不保存。';return;}lastDecision={id,action,record:{...r}};r.status=action==='confirm'?'confirmed':'dismissed';if(value!==undefined)r.text=value.trim();if(sheet.open)sheet.close();render();showToast(action==='confirm'?'已加入演示记忆，可在回顾里撤销':'已不保存，可撤销刚才的操作');}

case 'start-enroll':state.onboard=3;state.enroll=0;save();navigate('device-onboarding');break;
case 'revoke-voice':state.voiceConsent=false;state.enroll=0;save();sheet.close();render();showToast('演示声纹授权已撤回');break;
case 'voice-samples':modal('自定义声音样本','<p class="sheet-copy">声音克隆与身份声纹是两种用途，必须分开同意和撤回。只能使用本人或明确获得许可的声音。</p>'+notice('本原型不采集、不上传声音，也不生成或播放声音样本。','AudioLines')+'<div class="flow-foot">'+button('使用角色默认声音','data-action="default-voice"')+'</div>');break;
case 'default-voice':state.voice='default';sheet.close();render();showToast('演示已使用角色默认声音');break;
case 'save-character':state.voice='default';save();navigate('profile');showToast('已应用'+currentChar().name+'（仅本地演示）');break;
case 'prev-character':changeCharacter(state.character-1);break;
case 'next-character':changeCharacter(state.character+1);break;
case 'invite':invite(route==='bind'?state.useFor:null);break;
case 'invite-kind':invite(el.dataset.kind);break;
case 'accept-invite':{const kind=el.dataset.kind;if(!Object.hasOwn(state.relations,kind))break;state.relations[kind]=true;sheet.close();render();showToast('演示关系已确认；尚未授权共享内容');break;}
case 'guardian-permissions':{const kind=el.dataset.kind;if(!state.relations[kind])break;modal('共享范围','<p class="sheet-copy">仅在本人或监护人的单独授权后，显示基础使用趋势。私密对话与长期记忆不向家人开放。</p>'+notice('当前'+(state.sharing[kind]?'已允许共享基础趋势':'未授权共享')+'。真实权限以服务端校验为准。','ShieldCheck')+'<div class="flow-foot">'+button(state.sharing[kind]?'撤销演示趋势共享':'模拟单独授权基础趋势','data-action="set-sharing" data-kind="'+kind+'"',state.sharing[kind]?'danger-btn':'primary')+'</div>');break;}
case 'set-sharing':{const kind=el.dataset.kind;if(!state.relations[kind])break;state.sharing[kind]=!state.sharing[kind];sheet.close();render();showToast(state.sharing[kind]?'演示趋势共享已授权':'演示趋势共享已撤销');break;}
case 'search':showSearch=!showSearch;state.memoryTab='reviews';render();view.querySelector('#memory-search')?.focus();break;
case 'clear-search':memoryQuery='';render();break;
case 'calendar':modal('选择回顾日期','<label class="field">日期<input type="date" id="calendar-date" value="2026-09-0'+Math.min(6,Math.max(1,state.date))+'" min="2026-09-01" max="2026-09-06"></label><p class="caption">演示数据范围：2026 年 9 月 1–6 日。</p>'+button('查看这一天','data-action="choose-date"'));break;
case 'choose-date':{const date=document.getElementById('calendar-date');if(!date.value||!date.checkValidity()){date.reportValidity();break;}state.date=Number(date.value.slice(-2));sheet.close();render();break;}
case 'recap':recap(Number(el.dataset.day)||6);break;
case 'save-memory':decide(el.dataset.id,'confirm',document.getElementById('memory-edit').value);break;
case 'dismiss-memory':decide(el.dataset.id,'dismiss');break;
case 'undo':if(lastDecision){const index=state.records.findIndex(r=>r.id===lastDecision.id);state.records[index]=lastDecision.record;lastDecision=null;render();showToast('已撤销刚才的操作');}break;
case 'export':exportDemo();break;
case 'delete-demo':modal('清空演示记录？','<p class="sheet-copy">只删除当前页面中的虚构回顾和记忆。真实账号、设备、照片、声音均不受影响。可通过重置演示恢复示例。</p><label class="field">输入「清空演示」以确认<input id="delete-confirm" autocomplete="off" placeholder="清空演示"></label>'+button('清空演示记录','data-action="confirm-delete" id="delete-button" disabled','danger-btn'));break;
case 'confirm-delete':if(document.getElementById('delete-confirm').value!=='清空演示')break;state.records=[];state.recapsCleared=true;lastDecision=null;sheet.close();render();showToast('演示记录已清空');break;
case 'logout':modal('退出演示账号？','<p class="sheet-copy">将进入未登录体验。不会退出你手机上的真实微信。</p>'+button('退出演示','data-action="confirm-logout"'));break;
case 'confirm-logout':applyScenario('guest');navigate('home');break;
case 'login':if(!document.getElementById('auth-consent').checked)break;state.signedIn=true;state.scenario='loading';navigate('home');retrySyncAfterLogin();break;
case 'terms':modal('服务说明 · 原型','<p class="sheet-copy">Memoria 小程序用于设备设置、资料管理与回顾。实时语音在设备端完成。本页面为交互设计提案，不是正式服务协议，不接入真实微信或生产数据。</p>'+button('我知道了','data-action="close"'));break;
case 'onboard-next':state.onboard=Math.min(4,state.onboard+1);save();render(true);break;
case 'wifi-next':{const password=document.getElementById('wifi-password');const manual=document.getElementById('wifi-name').value==='manual';if(password.value.length<8||(manual&&!document.getElementById('wifi-manual').value.trim())){document.getElementById('wifi-error').textContent=manual&&!document.getElementById('wifi-manual').value.trim()?'请输入演示网络名称。':'请填写至少 8 位的演示密码，不要使用真实密码。';break;}password.value='';state.onboard=2;save();render(true);showToast('演示 Wi-Fi 已连接，未发送任何网络请求');break;}
case 'password':{const p=document.getElementById('wifi-password');p.type=p.type==='password'?'text':'password';el.textContent=p.type==='password'?'显示':'隐藏';el.setAttribute('aria-label',el.textContent+'演示密码');break;}
case 'confirm-user':if(['child','parent'].includes(state.useFor)&&!state.relations[state.useFor]){handleAction('invite',el);break;}state.onboard=3;save();navigate('device-onboarding');break;
case 'enroll-next':if(!document.getElementById('enroll-consent').checked)break;state.enroll=Math.min(4,state.enroll+1);save();render();showToast('第 '+state.enroll+' 段演示完成，没有调用麦克风');break;
case 'onboard-complete':state.onboard=4;state.voiceConsent=state.enroll===4;save();render(true);break;
case 'pause-onboarding':save();navigate('device');showToast('启用进度已保留，可从添加设备继续');break;
case 'restart-onboarding':modal('重新开始启用？','<p class="sheet-copy">将清除本地演示启用进度，不会解除真实设备绑定。</p>'+button('重新开始','data-action="restart-confirm"')+button('继续上次','data-action="close"','foot-link'));break;
case 'restart-confirm':state.onboard=0;state.enroll=0;save();sheet.close();render(true);break;
case 'finish-onboarding':state.scenario='ready';state.onboard=0;state.enroll=0;save();navigate('home');showToast('演示启用完成，正式版仍需设备回执');break;
}}
function retrySyncAfterLogin(){state.scenario='error';retrySync();}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled)return;const d=el.dataset;if(d.route){navigate(d.route);return;}if(d.action){handleAction(d.action,el);return;}if(d.toggle){if(d.toggle==='rawAudio'&&!state.rawAudio){modal('允许保存原始语音？','<p class="sheet-copy">建议只为用户主动选择的记录保存音频，并明确保存时长、使用目的与撤回方式。本原型不保存任何语音，正式策略需另行确认。</p>'+button('仅打开演示开关','data-allow-raw="true"')+button('保持关闭','data-action="close"','foot-link'));return;}state[d.toggle]=!state[d.toggle];save();render();view.querySelector('[data-toggle="'+d.toggle+'"]')?.focus({preventScroll:true});showToast('偏好已'+(persistence?'保存在本地演示':'在本次页面生效，浏览器无法持久保存'));return;}if(d.allowRaw){state.rawAudio=true;save();sheet.close();render();showToast('只更改演示开关，不采集语音');return;}if(d.device!==undefined){state.device=Number(d.device);state.scenario='ready';syncRevision++;clearTimeout(retryTimer);sheet.close();render(true);showToast('演示已切换设备，仅显示我的内容');return;}if(d.character!==undefined){changeCharacter(Number(d.character));return;}if(d.voice){state.voice=d.voice;render();return;}if(d.usefor){if(state.useFor!==d.usefor){state.enroll=0;state.voiceConsent=false;}state.useFor=d.usefor;save();render();return;}if(d.memoryTab){state.memoryTab=d.memoryTab;render();return;}if(d.filter){state.memoryFilter=d.filter;render();return;}if(d.date){state.date=Number(d.date);render();return;}if(d.edit){editMemory(d.edit);return;}if(d.confirm){decide(d.confirm,'confirm');}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-scenario]'))applyScenario(el.value);if(el.id==='auth-consent')document.getElementById('login-button').disabled=!el.checked;if(el.id==='enroll-consent')document.getElementById('enroll-button').disabled=!el.checked;if(el.id==='wifi-name')document.getElementById('wifi-manual-field').hidden=el.value!=='manual';});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='volume'){state.volume=Number(el.value);document.getElementById('volume-value').textContent=el.value+'%';}if(el.id==='delete-confirm')document.getElementById('delete-button').disabled=el.value!=='清空演示';if(el.id==='memory-search'){const start=el.selectionStart;memoryQuery=el.value;render();const input=document.getElementById('memory-search');input.focus({preventScroll:true});if(input.type==='search')input.setSelectionRange(start,start);}});
document.addEventListener('keydown',e=>{if(route==='companion'&&e.target.closest('.role-track')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();changeCharacter(state.character+(e.key==='ArrowRight'?1:-1));}});
render();
</script>
</body>
</html>
