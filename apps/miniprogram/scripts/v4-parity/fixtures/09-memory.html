<!doctype html><html lang="zh"><meta charset="utf-8">

<style>
:root{--bg:#F4F4F7;--card:#FFFFFF;--ink:#16182B;--ink2:#5B5F73;--ink3:#7A7E92;--line:#ECECF1;--acc:#4A52C9;--accbg:#EEEFFC;--soft:#F4F4F8;--rust:#9A4732;--rustbg:#FBEEE9;--sage:#23805F;--sagebg:#E7F4EE;--sun:#7F5A00;--sunbg:#FBF1D6;
--sans:"Inter","Noto Sans CJK SC",-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:#E6E6EC;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
.s{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
.c{padding:64px 24px 0;position:relative}
.eyebrow{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.2px}
h1{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:40px;margin-top:4px}
h2{font-size:20px;font-weight:700;letter-spacing:-.3px;margin:32px 0 16px}
.sub{font-size:15px;color:var(--ink2);margin-top:8px;line-height:24px}
.k{background:var(--card);border-radius:24px;box-shadow:0 1px 2px rgba(22,24,43,.04),0 8px 24px -8px rgba(22,24,43,.08),0 24px 48px -24px rgba(22,24,43,.10)}
.k.xl{border-radius:32px}
img.m{mix-blend-mode:multiply}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;height:24px;padding:0 12px;border-radius:99px}
.on{background:var(--sagebg);color:var(--sage)}.on:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sage)}
.draft{background:var(--sunbg);color:var(--sun)}.soon{background:var(--accbg);color:var(--acc)}
.ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center}
.ic svg{width:24px;height:24px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:16px;padding:16px;font-size:16px;min-height:64px}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.row .r{margin-left:auto;color:#B4B6C4;display:flex}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:600;font-size:17px;height:56px;border-radius:16px;color:#fff;background:var(--ink)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,24,43,.06),0 8px 24px -12px rgba(22,24,43,.12)}
.note{font-size:12px;color:var(--ink3);text-align:center;margin-top:16px;line-height:16px}
.tab{position:absolute;left:0;right:0;bottom:0;height:88px;padding:8px 16px 32px;background:rgba(250,250,252,.86);backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 rgba(22,24,43,.06);display:flex;justify-content:space-around;font-size:10px;font-weight:500;color:#8E91A3;z-index:2}
.tab div{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.tab svg{width:24px;height:24px}.tab .a{color:var(--acc)}.tab .a svg{fill:var(--accbg)}
.num{font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--ink2);font-weight:500}
.sl{height:8px;border-radius:8px;background:#ECECF2;position:relative;margin:24px 0 8px}
.sl span{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--acc)}
.sl em{position:absolute;top:-12px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(22,24,43,.18),0 0 0 .5px rgba(22,24,43,.08)}
.rg{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}

html,body{margin:0;padding:0;background:#F4F4F7}
body{width:390px;height:844px;overflow:hidden}
.s{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
</style>
<body><div class="s"><div class="c"><div class="eyebrow">长期记住的事</div><h1>记忆</h1><div class="sub">机器人长期只记住这三件事，用来更自然地和孩子聊天。</div>
