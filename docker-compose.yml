services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  control-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.control-api
    env_file:
      - .env
    environment:
      OFFLINE_MOCK: "${OFFLINE_MOCK:-false}"
    ports:
      - "8000:8000"
    volumes:
      - ./data/control-api:/app/data
    depends_on:
      - postgres
      - redis

  media-edge:
    build:
      context: .
      dockerfile: infra/Dockerfile.media-edge
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - redis
    environment:
      MEDIA_EDGE_HTTP_ADDR: "0.0.0.0:8080"
      MEDIA_EDGE_INTERNAL_HTTP_ADDR: "0.0.0.0:8081"

volumes:
  postgres-data:
