services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.13.5
    command: --config /etc/livekit.yaml
    profiles:
      - self-hosted
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis

  control-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.control-api
    env_file:
      - .env
    environment:
      OFFLINE_MOCK: "${OFFLINE_MOCK:-false}"
    ports:
      - "8000:8000"
    volumes:
      - ./data/control-api:/app/data
    depends_on:
      - postgres
      - redis

  agent:
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
    env_file:
      - .env
    depends_on:
      - control-api

  miniprogram-gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile.miniprogram-gateway
    env_file:
      - .env
    ports:
      - "8010:8010"
    depends_on:
      - control-api

  media-edge:
    build:
      context: .
      dockerfile: infra/Dockerfile.media-edge
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - redis
    environment:
      MEDIA_EDGE_HTTP_ADDR: "0.0.0.0:8080"
      MEDIA_EDGE_INTERNAL_HTTP_ADDR: "0.0.0.0:8081"

volumes:
  postgres-data:
