services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.13.3
    command: --config /etc/livekit.yaml
    profiles:
      - self-hosted
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis

  control-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.control-api
    env_file:
      - .env
    environment:
      OFFLINE_MOCK: "${OFFLINE_MOCK:-false}"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  agent:
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
    env_file:
      - .env
    depends_on:
      - control-api

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - control-api

volumes:
  postgres-data:
