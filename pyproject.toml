[project]
name = "voice-agent"
version = "0.1.0"
description = "Chinese full-duplex cascaded voice Agent monorepo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=18,<19",
  "openai>=2.36,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "aiohttp>=3.11,<4",
  "websockets>=14,<16",
  "httpx>=0.28,<1",
  "redis>=5.2,<7",
  "asyncpg>=0.30,<1",
  "orjson>=3.10,<4",
  "structlog>=25,<26",
  "opentelemetry-sdk>=1.30,<2",
  "grpcio>=1.70,<2",
  "grpcio-health-checking>=1.70,<2",
  "prometheus-client>=0.21,<1",
  "sentry-sdk[fastapi]>=2.20,<3",
  "numpy>=2.1,<3",
  "onnxruntime>=1.27,<2",
  "python-dotenv>=1.0,<2",
  "PyJWT>=2.9,<3",
  "cryptography>=45,<47",
  "boto3>=1.40,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "grpcio-tools>=1.70,<2",
  "jsonschema>=4.23,<5",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyJWT",
  "types-protobuf",
  "httpx>=0.28,<1",
  "pillow>=12,<13",
  "sounddevice>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "scripts", "tests"]
extend-exclude = ["services/agent/src/voice_core/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["services"]
namespace_packages = true
explicit_package_bases = true
exclude = "(?x)(^services/.*/tests/)|(^tests/)"

[[tool.mypy.overrides]]
module = [
  "grpc.*",
  "grpc_health.*",
  "opentelemetry.*",
  "prometheus_client.*",
  "sentry_sdk.*",
  "structlog.*",
  "asyncpg.*",
  "boto3.*",
  "botocore.*",
  "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services", "tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --tb=short --import-mode=importlib"
markers = [
    "sqlite_only: runs without MEMORIA_TEST_POSTGRES_DSN; skipped when the control backend is postgres",
    "hermetic: pure unit test under an app-postgres root; runs without MEMORIA_TEST_POSTGRES_DSN",
]

[tool.coverage.run]
source = ["services"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

