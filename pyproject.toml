[project]
name = "voice-agent"
version = "0.1.0"
description = "Chinese full-duplex cascaded voice Agent monorepo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=18,<19",
  "livekit-agents==1.6.5",
  "livekit-plugins-openai==1.6.5",
  "livekit-plugins-silero==1.6.5",
  "livekit-api>=1.1.1,<2",
  "openai>=2.36,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "aiohttp>=3.11,<4",
  "websockets>=14,<16",
  "httpx>=0.28,<1",
  "redis>=5.2,<7",
  "asyncpg>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "orjson>=3.10,<4",
  "structlog>=25,<26",
  "opentelemetry-sdk>=1.30,<2",
  "grpcio>=1.70,<2",
  "grpcio-health-checking>=1.70,<2",
  "prometheus-client>=0.21,<1",
  "sentry-sdk[fastapi]>=2.20,<3",
  "numpy>=2.1,<3",
  "python-dotenv>=1.0,<2",
  "PyJWT>=2.9,<3",
  "cryptography>=45,<47",
  "boto3>=1.40,<2",
]

[project.optional-dependencies]
kws = [
  "vosk==0.3.45",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "grpcio-tools>=1.70,<2",
  "jsonschema>=4.23,<5",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyJWT",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "scripts", "tests"]
extend-exclude = ["services/agent/src/voice_core/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["services"]
namespace_packages = true
explicit_package_bases = true
exclude = "(?x)(^services/.*/tests/)|(^tests/)"

[[tool.mypy.overrides]]
module = [
  "livekit.*",
  "grpc.*",
  "grpc_health.*",
  "livekit_agents.*",
  "livekit_plugins_openai.*",
  "livekit_plugins_silero.*",
  "opentelemetry.*",
  "prometheus_client.*",
  "sentry_sdk.*",
  "structlog.*",
  "asyncpg.*",
  "boto3.*",
  "botocore.*",
  "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services", "tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["services"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
