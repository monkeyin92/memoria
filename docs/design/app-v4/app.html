const story=(img,t,d,c)=>`<div class="row" style="padding:16px"><div style="width:64px;height:64px;border-radius:16px;background:${c};flex:none;overflow:hidden"><img class="m" src="assets/${img}.jpg" style="width:100%"></div><div style="flex:1"><b style="font-size:16px;font-weight:600">${t}</b><div style="font-size:13px;color:var(--ink3);margin-top:4px">${d} · 离线可听</div></div><div style="width:40px;height:40px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center">${I.play}</div></div>`;
S.push(`<div class="c"><div class="eyebrow">离线故事</div><h1>内容</h1><div class="sub">对机器人说“讲个故事”，就能开始播放。</div>
<div class="k xl" style="margin-top:24px;height:208px;position:relative;overflow:hidden;background:#FBEADF"><img class="m" src="assets/h_forest.jpg" style="position:absolute;right:-72px;top:0;width:224px"><div style="position:absolute;left:24px;bottom:24px;width:160px"><span class="chip" style="background:#fff;color:var(--ink)">今晚推荐</span><div style="font-size:22px;font-weight:700;letter-spacing:-.3px;margin-top:8px;line-height:28px">大熊和<br>森林里的<br>悄悄话</div><div style="font-size:13px;color:var(--ink2);margin-top:8px">约 6 分钟</div></div></div>
<h2 style="margin:24px 0 16px">全部故事</h2><div class="k" style="padding:0">${story('h_forest','大熊和森林里的悄悄话','约 6 分钟','#FBEADF')}${story('h_moon','小兔的纸船月亮','约 5 分钟','#FBF2D9')}${story('h_star','小狐狸收集星星','约 7 分钟','#ECEBF8')}</div>
<div class="note">儿歌等核对出处后再上线</div></div>${tab('首页')}`);
/* 8 roles */
const role=(img,n,d,on,c)=>`<div class="k" style="padding:8px 8px 16px;text-align:center;${on?'box-shadow:0 0 0 2px var(--acc),0 8px 24px -8px rgba(74,82,201,.25);':''}"><div style="height:96px;border-radius:16px;background:${c};overflow:hidden;display:grid;place-items:center"><img class="m" src="assets/${img}.jpg" style="width:104px;margin-top:8px"></div><b style="display:block;margin-top:8px;font-weight:600">${n}</b><div style="font-size:12px;color:var(--ink2);margin-top:4px">${d}</div>${on?'<span class="chip on" style="margin-top:8px">正在使用</span>':'<span class="chip" style="background:var(--soft);color:var(--ink2);margin-top:8px">切换</span>'}</div>`;
S.push(`<div class="c"><div class="eyebrow">说话风格</div><h1>角色</h1><div class="sub">换个说话风格。它始终是陪孩子聊天、讲故事的 AI 助手。</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px">${role('m_happy','小乐','开朗爱笑，适合白天',1,'#EEEFFC')}${role('m_curious','故事博士','慢慢讲，爱问为什么',0,'#F1F2F6')}${role('m_calm','温柔姐姐','说话轻柔，安抚情绪',0,'#F1F2F6')}${role('m_sleepy','晚安星星','睡前专用，声音更小',0,'#F1F2F6')}</div>
<div class="k" style="margin-top:16px;height:48px;border-radius:16px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--acc);font-weight:600">${I.plus}新建角色</div>
<div class="note" style="margin-top:8px">角色名称为示例</div></div>${tab('角色')}`);
/* 9 memory */
S.push(`<div class="c"><div class="eyebrow">长期记住的事</div><h1>记忆</h1><div class="sub">机器人长期只记住这三件事，用来更自然地和孩子聊天。</div>
<div class="k xl" style="margin-top:24px;padding:0">
${[['tag','称呼','乐乐','孩子喜欢被这样叫'],['heart','喜好','恐龙、画画、草莓','聊天时会提到'],['paw','宠物名','布丁（一只橘猫）','讲故事时可能出现']].map(r=>`<div class="row" style="padding:24px">${ic(r[0],'var(--accbg)','var(--acc)')}<div style="flex:1"><div style="font-size:13px;color:var(--ink3)">${r[1]}</div><div style="font-size:18px;font-weight:700;letter-spacing:-.2px;margin-top:4px">${r[2]}</div><div style="font-size:12px;color:var(--ink3);margin-top:4px">${r[3]}</div></div></div>`).join('')}</div>
<div class="k" style="margin-top:16px;padding:16px;display:flex;gap:16px;align-items:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--accbg);overflow:hidden;display:grid;place-items:center;flex:none"><img class="m" src="assets/m_curious.jpg" style="width:72px;margin-top:8px"></div><div style="font-size:13px;color:var(--ink2);line-height:20px">除这三项外，不长期保存其他信息。</div></div>
<div class="note">以上内容为示例</div></div>${tab('设备')}`);
/* 10 profile */
S.push(`<div class="c"><h1>我的</h1><div class="k xl" style="margin-top:24px;padding:24px;display:flex;gap:16px;align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-size:24px;font-weight:700">乐</div><div><div style="font-size:20px;font-weight:700;letter-spacing:-.3px">乐乐妈妈</div><div class="sub" style="margin-top:4px;font-size:14px">已绑定 1 台设备</div></div></div>
<div class="k" style="margin-top:16px;padding:16px;display:flex;align-items:center;gap:16px"><div style="width:56px;height:56px;border-radius:16px;background:var(--accbg);overflow:hidden;display:grid;place-items:center"><img class="m" src="assets/m_happy.jpg" style="width:72px;margin-top:8px"></div><div style="flex:1"><b style="font-weight:600">小乐</b><div style="margin-top:8px"><span class="chip on">在线</span></div></div><span style="color:#B4B6C4;display:flex">${I.chev}</span></div>
<div class="k" style="margin-top:16px;padding:0">${[['dev','设备管理'],['shield','授权与隐私说明'],['help','帮助与反馈'],['info','关于']].map(r=>`<div class="row">${ic(r[0])}${r[1]}<span class="r">${I.chev}</span></div>`).join('')}</div>
<div class="note" style="margin-top:24px">绑定新设备请在 Memoria 小程序中完成<br>版本 0.1 设计稿</div></div>${tab('我的')}`);
const N=['登录','监护人同意','首页','对话回顾','需要你关注','使用时长','内容','角色','记忆','我的'];
const r=document.getElementById('root');
if(P)r.innerHTML=`<div class="s">${S[P-1]}</div>`;
else{r.innerHTML=`<div style="padding:64px 72px 16px;display:flex;justify-content:space-between;align-items:flex-end"><div><div class="eyebrow" style="font-size:14px">MEMORIA · 家长端</div><div style="font-size:48px;font-weight:800;letter-spacing:-1.2px;margin-top:8px">App 设计稿 v4</div></div><div class="sub" style="font-size:16px;text-align:right">10 个页面 · 名字和数字均为示例<br>仅设计与演示用</div></div><div style="display:grid;grid-template-columns:repeat(5,390px);gap:48px 40px;padding:24px 72px 72px">${S.map((s,i)=>`<div><div style="font-size:15px;margin-bottom:16px;color:var(--ink2)"><b style="color:var(--ink);margin-right:8px">${String(i+1).padStart(2,'0')}</b>${N[i]}</div><div class="s" style="border-radius:48px;box-shadow:0 32px 64px -24px rgba(22,24,43,.3)">${s}</div></div>`).join('')}</div>`}
</script>
