syntax = "proto3";

package memoria.media.v1;

// This contract is authored by Memoria.  It intentionally describes only the
// media/Voice Core seam; LLM, memory and provider credentials never cross it.
option go_package = "github.com/monkeyin92/memoria-media-runtime/gen/media/v1;mediav1";

// The selected real-time state writer for one session. UNSPECIFIED is kept
// wire-compatible with clients that predate this contract and MUST be treated
// as PYTHON_AUTHORITATIVE by every receiver.
enum InteractionAuthority {
  INTERACTION_AUTHORITY_UNSPECIFIED = 0;
  INTERACTION_AUTHORITY_PYTHON_AUTHORITATIVE = 1;
  INTERACTION_AUTHORITY_GO_SHADOW = 2;
  INTERACTION_AUTHORITY_GO_AUTHORITATIVE = 3;
}

enum ContinuousEventKind {
  CONTINUOUS_EVENT_KIND_UNSPECIFIED = 0;
  CONTINUOUS_EVENT_KIND_AUDIO_FRAME = 1;
  CONTINUOUS_EVENT_KIND_VAD = 2;
  CONTINUOUS_EVENT_KIND_KEYWORD = 3;
  CONTINUOUS_EVENT_KIND_ASR_PARTIAL = 4;
  CONTINUOUS_EVENT_KIND_ASR_FINAL = 5;
  CONTINUOUS_EVENT_KIND_PLAYBACK_PROGRESS = 6;
  CONTINUOUS_EVENT_KIND_CLIENT_STOP = 7;
  CONTINUOUS_EVENT_KIND_PROVIDER_STATE = 8;
  CONTINUOUS_EVENT_KIND_DELEGATION_RESULT = 9;
}

enum FloorState {
  FLOOR_STATE_UNSPECIFIED = 0;
  FLOOR_STATE_USER_HOLDS_FLOOR = 1;
  FLOOR_STATE_ASSISTANT_HOLDS_FLOOR = 2;
  FLOOR_STATE_OVERLAP = 3;
  FLOOR_STATE_UNCERTAIN = 4;
  FLOOR_STATE_SILENCE = 5;
}

enum RealtimeEffectKind {
  REALTIME_EFFECT_KIND_UNSPECIFIED = 0;
  REALTIME_EFFECT_KIND_DUCK_OUTPUT = 1;
  REALTIME_EFFECT_KIND_CANCEL_GENERATION = 2;
  REALTIME_EFFECT_KIND_PAUSE_OUTPUT = 3;
  REALTIME_EFFECT_KIND_RESUME_OUTPUT = 4;
  REALTIME_EFFECT_KIND_EMIT_PROVISIONAL_PATCH = 5;
  REALTIME_EFFECT_KIND_COMMIT_TURN_CANDIDATE = 6;
  REALTIME_EFFECT_KIND_START_DELEGATION = 7;
  REALTIME_EFFECT_KIND_ENQUEUE_OUTPUT_INTENT = 8;
  REALTIME_EFFECT_KIND_DROP_STALE_EVENT = 9;
}

enum OutputIntentKind {
  OUTPUT_INTENT_KIND_UNSPECIFIED = 0;
  OUTPUT_INTENT_KIND_FAST_ACKNOWLEDGEMENT = 1;
  OUTPUT_INTENT_KIND_DEEP_RESULT = 2;
  OUTPUT_INTENT_KIND_TOOL_RESULT = 3;
  OUTPUT_INTENT_KIND_REMINDER = 4;
  OUTPUT_INTENT_KIND_BACKCHANNEL = 5;
  OUTPUT_INTENT_KIND_NOTIFICATION = 6;
  OUTPUT_INTENT_KIND_CONVERSATION_REPLY = 7;
}

enum FloorRequirement {
  FLOOR_REQUIREMENT_UNSPECIFIED = 0;
  FLOOR_REQUIREMENT_ANY = 1;
  FLOOR_REQUIREMENT_ASSISTANT_MAY_SPEAK = 2;
  FLOOR_REQUIREMENT_SILENCE = 3;
}

enum ProjectionEventKind {
  PROJECTION_EVENT_KIND_UNSPECIFIED = 0;
  PROJECTION_EVENT_KIND_PROVISIONAL_STARTED = 1;
  PROJECTION_EVENT_KIND_PROVISIONAL_PATCH = 2;
  PROJECTION_EVENT_KIND_PROVISIONAL_DISCARDED = 3;
  PROJECTION_EVENT_KIND_TURN_COMMITTED = 4;
}

message SpeakerEvidence {
  string speaker_class = 1;
  float confidence = 2;
  string reason_code = 3;
  bool authority_verified = 4;
}

// Normalized continuous input for the interaction kernel. payload contains
// kind-specific bytes; authorization and owner policy remain Python-owned.
message ContinuousInteractionEvent {
  string event_id = 1;
  string session_id = 2;
  uint64 stream_epoch = 3;
  uint64 sequence = 4;
  uint64 capture_start_sample = 5;
  uint64 capture_end_sample = 6;
  uint64 source_monotonic_ms = 7;
  ContinuousEventKind event_kind = 8;
  uint64 turn_id = 9;
  uint64 generation_id = 10;
  uint64 tool_epoch = 11;
  uint64 task_epoch = 12;
  uint64 context_version = 13;
  SpeakerEvidence speaker_evidence = 14;
  bytes payload = 15;
}

// A kernel decision is data until the authority guard admits it. Go-shadow
// producers MUST set candidate_only and no consumer may execute such a value.
message RealtimeEffect {
  string effect_id = 1;
  string session_id = 2;
  uint64 stream_epoch = 3;
  uint64 sequence = 4;
  RealtimeEffectKind effect_kind = 5;
  string source_event_id = 6;
  uint64 turn_id = 7;
  uint64 generation_id = 8;
  uint64 tool_epoch = 9;
  uint64 task_epoch = 10;
  uint64 context_version = 11;
  bool candidate_only = 12;
  bytes payload = 13;
  // Full stream identity is required on the executable Core -> Media path.
  // The legacy session_id/stream_epoch fields remain for additive compatibility.
  SessionIdentity identity = 14;
}

// Python-authoritative Floor state for the executable media path. Unlike the
// candidate-only ShadowFloorDecision, this has a per-stream monotonic epoch,
// a full generation fence and no untyped payload.
message FloorEffect {
  string effect_id = 1;
  SessionIdentity identity = 2;
  uint64 sequence = 3;
  FloorState floor_state = 4;
  uint64 floor_epoch = 5;
  string source_event_id = 6;
  uint64 turn_id = 7;
  uint64 generation_id = 8;
  uint64 tool_epoch = 9;
  uint64 task_epoch = 10;
  uint64 context_version = 11;
  bool candidate_only = 12;
  // Reject delayed control updates before they can revive an obsolete floor.
  uint64 expires_at_ms = 13;
}

message OutputIntent {
  string intent_id = 1;
  string session_id = 2;
  uint64 turn_id = 3;
  uint64 generation_id = 4;
  uint64 tool_epoch = 5;
  OutputIntentKind kind = 6;
  uint32 priority = 7;
  uint64 created_at_ms = 8;
  uint64 expires_at_ms = 9;
  FloorRequirement floor_requirement = 10;
  uint64 context_version = 11;
  oneof source {
    bytes pcm_s16le = 12;
    string tts_source = 13;
  }
}

message ProjectionEvent {
  string event_id = 1;
  string session_id = 2;
  uint64 stream_epoch = 3;
  uint64 sequence = 4;
  ProjectionEventKind event_kind = 5;
  uint64 turn_id = 6;
  uint64 revision = 7;
  uint64 capture_start_sample = 8;
  uint64 capture_end_sample = 9;
  string text = 10;
  FloorState floor_state = 11;
  SpeakerEvidence speaker_evidence = 12;
  uint64 generation_id = 13;
  uint64 tool_epoch = 14;
  uint64 context_version = 15;
  bool history_eligible = 16;
  string reason = 17;
}

service VoiceMediaBridge {
  rpc Connect(stream MediaToCore) returns (stream CoreToMedia);
}

enum AudioEncoding {
  AUDIO_ENCODING_UNSPECIFIED = 0;
  AUDIO_ENCODING_PCM_S16LE = 1;
  AUDIO_ENCODING_OPUS = 2;
}

enum ConversationState {
  CONVERSATION_STATE_UNSPECIFIED = 0;
  CONVERSATION_STATE_CONNECTING = 1;
  CONVERSATION_STATE_LISTENING = 2;
  CONVERSATION_STATE_USER_SPEAKING = 3;
  CONVERSATION_STATE_FINALIZING = 4;
  CONVERSATION_STATE_THINKING = 5;
  CONVERSATION_STATE_ASSISTANT_SPEAKING = 6;
  CONVERSATION_STATE_INTERRUPT_PENDING = 7;
  CONVERSATION_STATE_RECOVERING = 8;
  CONVERSATION_STATE_CLOSED = 9;
}

enum VadEventType {
  VAD_EVENT_UNSPECIFIED = 0;
  VAD_EVENT_SPEECH_START = 1;
  VAD_EVENT_SPEECH_END = 2;
}

enum GenerationAction {
  GENERATION_ACTION_UNSPECIFIED = 0;
  GENERATION_ACTION_START = 1;
  GENERATION_ACTION_CANCEL = 2;
  GENERATION_ACTION_COMPLETE = 3;
  GENERATION_ACTION_PAUSE = 4;
  GENERATION_ACTION_RESUME = 5;
}

message SessionIdentity {
  string session_id = 1;
  string account_id = 2;
  string participant_id = 3;
  string device_id = 4;
  string client_type = 5;
  uint64 stream_epoch = 6;
}

message AudioFormat {
  AudioEncoding encoding = 1;
  uint32 sample_rate = 2;
  uint32 channels = 3;
  uint32 frame_ms = 4;
}

message SessionHello {
  SessionIdentity identity = 1;
  AudioFormat uplink_format = 2;
  AudioFormat downlink_format = 3;
  map<string, string> capabilities = 4;
  string traceparent = 5;
  // Requested session authority. UNSPECIFIED is an old client and therefore
  // requests the safe PYTHON_AUTHORITATIVE mode.
  InteractionAuthority interaction_authority = 6;
}

message AudioFrame {
  SessionIdentity identity = 1;
  uint64 sequence = 2;
  uint64 capture_start_sample = 3;
  uint32 frame_samples = 4;
  bytes payload = 5;
  uint32 crc32c = 6;
  bool discontinuity = 7;
}

message VadEvent {
  SessionIdentity identity = 1;
  VadEventType type = 2;
  uint64 sample_position = 3;
  float probability = 4;
  float rms = 5;
  float noise_floor = 6;
  // Required for SPEECH_END. Unlike sample_position, this excludes the VAD
  // hangover/tail silence and is the acoustic boundary ASR must cover.
  optional uint64 voiced_end_sample = 7;
}

message KeywordEvent {
  SessionIdentity identity = 1;
  string keyword = 2;
  float confidence = 3;
  uint64 start_sample = 4;
  uint64 end_sample = 5;
  bool hard_stop = 6;
  // Wall-clock millisecond when Media Edge detected the keyword locally.
  // Voice Core uses this as the interrupt.detect anchor so the interrupt
  // SLO includes Edge-side detection, gate and network hops instead of only
  // the time after the event reaches the Core.
  optional uint64 detected_monotonic_ms = 7;
}

message PlaybackProgress {
  SessionIdentity identity = 1;
  uint64 generation_id = 2;
  uint64 received_sequence = 3;
  uint64 rendered_sample_end = 4;
  uint64 client_monotonic_ms = 5;
  bool approximate = 6;
  uint64 turn_id = 7;
  uint64 tool_epoch = 8;
}

message DeviceEvent {
  SessionIdentity identity = 1;
  string event_type = 2;
  bytes json_payload = 3;
  uint64 monotonic_ms = 4;
}

message MediaMetric {
  SessionIdentity identity = 1;
  string name = 2;
  double value = 3;
  map<string, string> labels = 4;
  uint64 turn_id = 5;
  uint64 generation_id = 6;
  uint64 tool_epoch = 7;
}

message MediaToCore {
  oneof event {
    SessionHello hello = 1;
    AudioFrame audio = 2;
    VadEvent vad = 3;
    KeywordEvent keyword = 4;
    PlaybackProgress playback = 5;
    DeviceEvent device = 6;
    MediaMetric metric = 7;
  }
}

message SessionAccepted {
  SessionIdentity identity = 1;
  ConversationState state = 2;
  uint64 current_generation_id = 3;
  // Effective server-selected authority. UNSPECIFIED MUST still be treated as
  // PYTHON_AUTHORITATIVE by old and new clients.
  InteractionAuthority interaction_authority = 4;
  uint64 current_turn_id = 5;
  uint64 current_tool_epoch = 6;
  uint64 task_epoch = 7;
  uint64 context_version = 8;
}

message AssistantAudioFrame {
  SessionIdentity identity = 1;
  uint64 turn_id = 2;
  uint64 generation_id = 3;
  uint64 tool_epoch = 4;
  uint64 sequence = 5;
  uint64 source_start_sample = 6;
  uint32 frame_samples = 7;
  bytes pcm_s16le = 8;
  bool first_frame = 9;
  bool final_frame = 10;
  uint64 task_epoch = 11;
  uint64 context_version = 12;
}

message GenerationControl {
  SessionIdentity identity = 1;
  uint64 turn_id = 2;
  uint64 generation_id = 3;
  uint64 tool_epoch = 4;
  GenerationAction action = 5;
  string reason = 6;
  uint64 sequence = 7;
  uint64 task_epoch = 8;
  uint64 context_version = 9;
}

message TranscriptEvent {
  SessionIdentity identity = 1;
  uint64 turn_id = 2;
  uint64 revision = 3;
  uint64 capture_start_sample = 4;
  uint64 capture_end_sample = 5;
  string text = 6;
  bool final = 7;
  float confidence = 8;
  string speaker_class = 9;
  uint64 generation_id = 10;
  uint64 tool_epoch = 11;
  uint64 sequence = 12;
  uint64 task_epoch = 13;
  uint64 context_version = 14;
}

enum ShadowObservationKind {
  SHADOW_OBSERVATION_KIND_UNSPECIFIED = 0;
  SHADOW_OBSERVATION_KIND_SPEECH_TASK_STARTED = 1;
  SHADOW_OBSERVATION_KIND_SPEECH_SEGMENT = 2;
  SHADOW_OBSERVATION_KIND_SPEECH_COMMIT = 3;
  SHADOW_OBSERVATION_KIND_CONTEXT_ACTIVATED = 4;
  SHADOW_OBSERVATION_KIND_OUTPUT_INTENT = 5;
  SHADOW_OBSERVATION_KIND_FLOOR_DECISION = 6;
}

// Sanitized Timeline metadata for one no-side-effect shadow observation.
// Transcript text is represented only by a digest so the comparison ledger
// does not create another copy of user speech.
message ShadowSpeechSegment {
  string segment_id = 1;
  uint64 capture_start_sample = 2;
  uint64 capture_end_sample = 3;
  uint64 task_epoch = 4;
  uint64 revision = 5;
  bytes text_sha256 = 6;
  bool final = 7;
}

message ShadowSpeechTaskStarted {
  uint64 task_epoch = 1;
}

message ShadowSpeechCommit {
  uint64 committed_sample = 1;
}

message ShadowContextActivated {
  uint64 context_version = 1;
}

message ShadowOutputIntent {
  string intent_id = 1;
  uint64 turn_id = 2;
  uint64 generation_id = 3;
  uint64 tool_epoch = 4;
  OutputIntentKind kind = 5;
  uint32 priority = 6;
  uint64 created_at_ms = 7;
  uint64 expires_at_ms = 8;
  FloorRequirement floor_requirement = 9;
  uint64 context_version = 10;
}

message ShadowSpeechTimelineState {
  uint64 committed_sample = 1;
  uint64 latest_task_epoch = 2;
  repeated ShadowSpeechSegment segments = 3;
}

// Typed floor/effect evidence for candidate-only parity. The effect remains
// data in go_shadow; the Python authority is still the only executor.
message ShadowFloorDecision {
  FloorState floor_state = 1;
  RealtimeEffectKind effect_kind = 2;
  uint64 turn_id = 3;
  uint64 generation_id = 4;
  uint64 tool_epoch = 5;
}

message ShadowOutputArbiterState {
  uint64 context_version = 1;
  // Compatibility winner for readers that predate the bounded active set.
  ShadowOutputIntent candidate = 2;
  repeated ShadowOutputIntent active_candidates = 3;
  // Distinguishes a complete empty set from a legacy winner-only state.
  bool active_candidates_complete = 4;
}

message ShadowObservation {
  SessionIdentity identity = 1;
  uint64 sequence = 2;
  uint64 shadow_sequence = 3;
  string contract_version = 4;
  bool candidate_only = 5;
  ShadowObservationKind kind = 6;
  oneof input {
    ShadowSpeechTaskStarted speech_task_started = 7;
    ShadowSpeechSegment speech_segment = 8;
    ShadowSpeechCommit speech_commit = 9;
    ShadowContextActivated context_activated = 13;
    ShadowOutputIntent output_intent = 14;
    ShadowFloorDecision floor_decision = 17;
  }
  bool authoritative_accepted = 10;
  string authoritative_reason = 11;
  ShadowSpeechTimelineState authoritative_timeline = 12;
  uint64 observed_at_ms = 15;
  uint64 authoritative_context_version = 16;
  ShadowOutputArbiterState authoritative_output_arbiter = 18;
  bool authoritative_consumed = 19;
}

message StateEvent {
  SessionIdentity identity = 1;
  ConversationState state = 2;
  uint64 turn_id = 3;
  uint64 generation_id = 4;
  string reason = 5;
  uint64 sequence = 6;
  uint64 tool_epoch = 7;
  uint64 task_epoch = 8;
  uint64 context_version = 9;
}

message ClientEvent {
  SessionIdentity identity = 1;
  string type = 2;
  bytes json_payload = 3;
  uint64 turn_id = 4;
  uint64 generation_id = 5;
  uint64 tool_epoch = 6;
  uint64 sequence = 7;
  // Optional v1 extensions. Zero preserves wire compatibility with older
  // Media Edge and browser clients that did not carry these versions.
  uint64 task_epoch = 8;
  uint64 context_version = 9;
}

message CoreError {
  SessionIdentity identity = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
  uint64 turn_id = 5;
  uint64 generation_id = 6;
  uint64 tool_epoch = 7;
  uint64 task_epoch = 8;
  uint64 context_version = 9;
}

message CoreToMedia {
  oneof event {
    SessionAccepted accepted = 1;
    AssistantAudioFrame audio = 2;
    GenerationControl generation = 3;
    TranscriptEvent transcript = 4;
    StateEvent state = 5;
    ClientEvent client = 6;
    CoreError error = 7;
    ShadowObservation shadow_observation = 8;
    RealtimeEffect realtime_effect = 9;
    FloorEffect floor_effect = 10;
  }
}
