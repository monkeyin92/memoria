version: v2
plugins:
  # Go bindings are generated from the same descriptor for Media Edge. Run
  # `buf generate --template buf.gen.go.yaml` in this directory; protoc-gen-go
  # and protoc-gen-go-grpc must be on your PATH. paths=source_relative keeps
  # the checked-in memoria/... layout under services/media_edge/gen.
  - local: protoc-gen-go
    out: ../../services/media_edge/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../../services/media_edge/gen
    opt: paths=source_relative
