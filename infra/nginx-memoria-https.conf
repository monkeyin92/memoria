# Include this file only from a Memoria-enabled TLS server block.

location = /memoria-h5 {
    return 308 /memoria-h5/;
}

location = /memoria-h5/index.html {
    root /var/www;
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "microphone=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss:; worker-src 'self' blob:" always;
}

location ^~ /memoria-h5/assets/ {
    root /var/www;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /memoria-h5/ {
    root /var/www;
    try_files $uri $uri/ /memoria-h5/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "microphone=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss:; worker-src 'self' blob:" always;
}

location = /memoria-api {
    return 308 /memoria-api/;
}

location = /memoria-mini-media/v1/mini-program/media {
    # New clients use TLS Upgrade headers; legacy clients use the first WSS message.
    # Media tickets never appear in the URL.
    # Keep voice-transport metadata out of access logs as a defense in depth.
    access_log off;
    limit_req_status 429;
    limit_req zone=memoria_media burst=6 nodelay;
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:8792/v1/mini-program/media;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /memoria-api/internal/ {
    return 404;
}

location = /memoria-api/v1/auth/anonymous {
    limit_req_status 429;
    limit_req zone=memoria_session burst=3 nodelay;
    proxy_pass http://127.0.0.1:8791/v1/auth/anonymous;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /memoria-api/v1/auth/register {
    limit_req_status 429;
    limit_req zone=memoria_session burst=3 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8791/v1/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /memoria-api/v1/auth/login {
    limit_req_status 429;
    limit_req zone=memoria_session burst=3 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8791/v1/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /memoria-api/v1/auth/wechat-login {
    limit_req_status 429;
    # A first-time login performs one openid probe followed by one phone-bound
    # request. 8443 reaches this server through the local stream mux, so keep
    # the same bounded cushion as session creation.
    limit_req zone=memoria_session burst=6 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8791/v1/auth/wechat-login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /memoria-api/v1/auth/wechat-avatar {
    limit_req_status 429;
    limit_req zone=memoria_api burst=3 nodelay;
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:8791/v1/auth/wechat-avatar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /memoria-api/v1/auth/wechat-avatars/ {
    # The path contains an unguessable bearer-style public id for a personal image.
    access_log off;
    proxy_pass http://127.0.0.1:8791/v1/auth/wechat-avatars/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Biometric enrollment is explicit, authenticated and tightly bounded. Runtime
# classification stays on the container network and is never a public route.
location = /memoria-api/v1/speakers/classify {
    return 404;
}

location = /memoria-api/v1/speakers/enrollments {
    limit_req_status 429;
    limit_req zone=memoria_session burst=1 nodelay;
    client_max_body_size 18m;
    proxy_pass http://127.0.0.1:8791/v1/speakers/enrollments;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

location = /memoria-api/v1/sessions {
    limit_req_status 429;
    # 8443 reaches this server through a local stream mux. The client itself
    # is single-flight; keep one bounded retry cushion for a transient ticket
    # refresh without treating an unverified request header as an identity.
    limit_req zone=memoria_session burst=6 nodelay;
    proxy_pass http://127.0.0.1:8791/v1/sessions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Omni SDP/telemetry (HTTP) + Qwen-Audio /audio/ws (WebSocket long-lived).
location ^~ /memoria-api/v1/sessions/ {
    limit_req_status 429;
    limit_req zone=memoria_session burst=6 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8791/v1/sessions/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Internal Agent upload. A 60 s mono PCM16/16 kHz WAV is about 1.9 MiB
# (about 2.6 MiB after base64); keep a narrow explicit cap instead of raising
# the limit for every public API route.
location = /memoria-api/v1/archive/session-raw-audio {
    limit_req_status 429;
    limit_req zone=memoria_api burst=6 nodelay;
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:8791/v1/archive/session-raw-audio;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Signed provider sample tokens are query parameters; never place them in access logs.
location ^~ /memoria-api/v1/voices/provider-samples/ {
    access_log off;
    proxy_pass http://127.0.0.1:8791/v1/voices/provider-samples/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /memoria-api/ {
    limit_req_status 429;
    limit_req zone=memoria_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
