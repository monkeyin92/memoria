# Target-server-only loopback smoke config. It never replaces the live Nginx config.
pid /tmp/memoria-nginx-smoke.pid;
error_log /tmp/memoria-nginx-smoke-error.log notice;

events {}

http {
    include /etc/nginx/mime.types;
    access_log off;

    limit_req_zone $binary_remote_addr zone=memoria_session:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=memoria_api:10m rate=60r/m;

    server {
        listen 127.0.0.1:18891;
        server_name aginice.cn;
        include /etc/nginx/snippets/memoria-https.conf;
    }
}
