# Local self-hosted LiveKit sample. Generate unique production secrets/config with livekit/generate.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
redis:
  address: redis:6379
keys:
  # Public development credential pair. Never reuse it outside local development.
  devkey: devsecret
