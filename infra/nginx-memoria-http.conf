# Include this file only from the port 80 default server.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/memoria-acme;
    try_files $uri =404;
    default_type text/plain;
}

location ^~ /memoria-h5 {
    default_type text/plain;
    return 410 "Memoria H5 client has been retired.\n";
}

location = /memoria-api {
    return 308 https://122.51.108.140:8443/memoria-api/;
}

location ^~ /memoria-api/ {
    return 308 https://122.51.108.140:8443$request_uri;
}
