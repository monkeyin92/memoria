# Loaded by Nginx in the http context via /etc/nginx/conf.d/*.conf.
# These zones only affect locations that explicitly opt in.
#
# Keys stay $binary_remote_addr. On the 8443 path the 9443 server must take
# the client address from PROXY protocol (see nginx-memoria-stream.conf and
# nginx-memoria-ip-server.conf). Do not key these zones on client-claimed
# Device-Id or arbitrary forward headers. Post-auth device quotas live in
# media-edge (JWT device_id + per-connection buckets), not here.

limit_req_zone $binary_remote_addr zone=memoria_session:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=memoria_api:10m rate=60r/m;
# Media WSS reconnects must not consume the login/session burst for the same NAT IP.
limit_req_zone $binary_remote_addr zone=memoria_media:10m rate=30r/m;
