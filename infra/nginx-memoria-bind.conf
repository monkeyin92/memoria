# WeChat "扫普通链接二维码打开小程序" for the board's bind QR:
#   https://aigcnice.com/memoria-bind/?b=<signed bootstrap payload>
# Included from the 443 aigcnice.com server block (the WMS vhost owns 443).
# WeChat opens the Mini Program from the prefix rule without loading this
# page; it only fetches the rule's verification file, which lives in this
# directory. A browser that opens the link gets a short note. The query holds
# the board's proof-of-possession, so it is never written to the access log.
location ^~ /memoria-bind/ {
    access_log off;
    root /var/www;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /memoria-bind/index.html;
}
