# Exact direct-device WSS route for the Go media-edge direct_voice_core path,
# the only device media ingress. Install as an Nginx snippet and include it only
# from Memoria's TLS server blocks. It proxies to the loopback-only media-edge
# port 8794 (container 8082). The retired Python device gateway route
# (/memoria-device-media/v1/device/media on 127.0.0.1:8793) no longer exists.

location = /memoria-device-edge/v1/device/media {
    access_log off;
    limit_req_status 429;
    limit_req zone=memoria_media burst=6 nodelay;
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:8794/v1/device/media;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Protocol-Version $http_protocol_version;
    proxy_set_header Device-Id $http_device_id;
    proxy_set_header X-Client-ID $http_x_client_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
