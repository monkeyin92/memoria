# Include this exact media route from both the standard 443 edge server and
# Memoria's legacy 8443 HTTPS server.

location = /memoria-mini-media/v1/mini-program/media {
    # New clients use TLS Upgrade headers; legacy clients use the first WSS message.
    # Media tickets never appear in the URL.
    # Keep voice-transport metadata out of access logs as a defense in depth.
    access_log off;
    limit_req_status 429;
    limit_req zone=memoria_media burst=6 nodelay;
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:8792/v1/mini-program/media;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
