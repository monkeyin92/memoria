# The input is bound to its own ruleset, so the default rules in
# /etc/rsyslog.conf never see these lines.
module(load="imudp")
input(type="imudp" address="127.0.0.1" port="5514" ruleset="memoria")

template(name="memoria_line" type="string"
         string="%timereported:::date-rfc3339% %app-name% %msg%\n")

ruleset(name="memoria") {
    if $app-name startswith "control-api/" then {
        action(type="omfile" file="/var/log/memoria/control-api.log" template="memoria_line"
               fileOwner="syslog" fileGroup="syslog" fileCreateMode="0600")
    }
    if $app-name startswith "voice-core-media-bridge/" then {
        action(type="omfile" file="/var/log/memoria/voice-core-media-bridge.log" template="memoria_line"
               fileOwner="syslog" fileGroup="syslog" fileCreateMode="0600")
    }
}
