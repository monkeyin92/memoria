# Include inside the top-level Nginx `stream {}` block.
# Public 8443 is a plain TCP pass-through to the local Memoria HTTPS virtual
# host (TLS terminates there). The ssl_preread split that sent raw ICE/TCP to
# a local LiveKit listener was removed with the LiveKit media chain.

upstream memoria_https_8443 {
    server 127.0.0.1:9443;
}

server {
    listen 8443;
    listen [::]:8443;
    proxy_pass memoria_https_8443;
    proxy_connect_timeout 5s;
    proxy_timeout 86400s;
}
