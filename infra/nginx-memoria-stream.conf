# Include inside the top-level Nginx `stream {}` block.
# TLS on 8443 continues to the existing HTTPS virtual host. Raw ICE/TCP
# traffic on the same public port is forwarded to LiveKit's local listener.

map $ssl_preread_protocol $memoria_8443_backend {
    "" memoria_livekit_rtc;
    default memoria_https_8443;
}

upstream memoria_https_8443 {
    server 127.0.0.1:9443;
}

upstream memoria_livekit_rtc {
    server 127.0.0.1:8444;
}

server {
    listen 8443;
    listen [::]:8443;
    proxy_pass $memoria_8443_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 86400s;
    ssl_preread on;
}
