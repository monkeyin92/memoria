# Trusted HTTPS endpoint behind the 8443 stream multiplexer.
# Port 443 remains owned by the existing WMS virtual host on this server.

server {
    listen 127.0.0.1:9443 ssl;
    server_name 122.51.108.140;

    ssl_certificate /etc/letsencrypt/live/memoria-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memoria-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MEMORIA_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 60m;

    location = / {
        root /var/www;
        try_files /memoria-h5/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "microphone=(self)" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Preserve the WMS routes already hosted on the destination server.
    location = /wms {
        return 301 /wms/;
    }

    location ^~ /wms/api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /wms/api;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /wms/ {
        root /var/www;
        try_files $uri $uri/ /wms/index.html;
    }

    include /etc/nginx/snippets/memoria-livekit.conf;
    include /etc/nginx/snippets/memoria-https.conf;

    location / {
        return 404;
    }
}
