# Dedicated trusted HTTPS entry point for direct access by the public IPv4 address.
# The aginice.cn 443/8443 server is tracked separately in nginx-aginice-server.conf.

server {
    listen 443 ssl default_server;
    server_name 110.42.235.198;

    ssl_certificate /etc/letsencrypt/live/memoria-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memoria-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MEMORIA_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 60m;

    # Preserve every route previously reachable through the default TLS server.
    location = / {
        return 200 "EchoLife API is running. Use /echolife-api/health\n";
        add_header Content-Type text/plain;
    }

    location = /echolife-api/voice-agent/realtime {
        proxy_pass http://127.0.0.1:8790/voice-agent/realtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /echolife-api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /echolife-api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    include /etc/nginx/snippets/memoria-https.conf;
}
